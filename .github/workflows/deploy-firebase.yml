name: Firebase 운영 배포

on:
  workflow_dispatch:
    inputs:
      deploy_confirmation:
        description: "배포하시겠습니까?"
        required: true
        type: choice
        default: "아니요"
        options:
          - "아니요"
          - "예"

permissions:
  contents: read

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  cancelled:
    name: 배포 취소 확인
    if: ${{ inputs.deploy_confirmation != '예' }}
    runs-on: ubuntu-latest
    steps:
      - name: 취소 안내
        run: echo '사용자가 배포를 승인하지 않아 아무것도 배포하지 않았습니다.'

  deploy:
    name: 승인 후 Firebase Hosting 배포
    if: ${{ inputs.deploy_confirmation == '예' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://busan-hak-port.web.app

    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v5

      - name: main 브랜치 배포 여부 확인
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "운영 배포는 main 브랜치에서만 가능합니다. 현재: ${GITHUB_REF}"
            exit 1
          fi

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 배포 전 최종 검사
        run: npm run check

      - name: Google Cloud 인증
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUSAN_HAK_PORT }}

      - name: Firebase Hosting 배포
        run: npx --yes firebase-tools@15.3.1 deploy --only hosting --project busan-hak-port --non-interactive
