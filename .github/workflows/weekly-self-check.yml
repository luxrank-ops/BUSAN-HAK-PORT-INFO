name: 주간 자가 점검 · 자가 복구 (매주 월요일 05시 KST)

# 목적
#   매주 월요일 05:00 KST (일요일 20:00 UTC)에 앱이 스스로를 점검하고,
#   데이터 변화(수집량·필드 구조)를 감지해 자동 복구를 시도한 뒤 보고서를 남깁니다.
#
#   1) 기능 점검   : 필수 파일 · JSON · 주간 스케줄 등록 · 배포 사이트 헬스 · 일일 점검 상태
#   2) 데이터 감지 : 8개 터미널 스케줄 API 를 실제 호출해 수집량/핵심 필드 채움률을
#                    지난 주 기준선(reports/self-check/baseline.json)과 비교
#   3) 자동 복구   : 실패한 터미널 재수집(백오프) → 그래도 실패하면 GitHub 이슈로 에스컬레이션
#                    (서버 측 상태·캐시 복구는 Vercel Cron 이 담당 — 서로 같은 판정 엔진 사용)
#   4) 보고서      : reports/self-check/ · docs/inspections/ 에 커밋(영구 보존) + 아티팩트
#
# 메일 발송
#   기본은 Vercel Cron(/api/cron/weekly-self-check)이 발송합니다(중복 방지).
#   Vercel 프로젝트에 메일 자격증명을 넣을 수 없다면, 저장소 Variables 에
#   SELF_CHECK_EMAIL_ON_CLI=1 을 등록해 이 워크플로가 대신 발송하도록 하세요.
#   (자격증명: Secrets RESEND_API_KEY 또는 GOOGLE_CLIENT_ID/SECRET/REFRESH_TOKEN 또는 SMTP_USER/PASS)
#
# 수동 실행: Actions 탭 → 이 워크플로 → Run workflow

on:
  schedule:
    - cron: '0 20 * * 0' # 일요일 20:00 UTC = 월요일 05:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # 미해결 이상 항목을 이슈로 남길 때 사용

concurrency:
  group: weekly-self-check
  cancel-in-progress: false

jobs:
  self-check:
    name: 주간 자가 점검 실행
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 품질 검사 (typecheck + validate + tokens:check + test)
        continue-on-error: true
        run: npm run check

      - name: 주간 자가 점검 실행
        id: selfcheck
        env:
          SELF_CHECK_BASE_URL: ${{ vars.SELF_CHECK_BASE_URL || 'https://busan-hak-port-info.vercel.app' }}
          SELF_CHECK_AUTO_FIX: ${{ vars.SELF_CHECK_AUTO_FIX || '1' }}
          SELF_CHECK_DRIFT_WARN_RATIO: ${{ vars.SELF_CHECK_DRIFT_WARN_RATIO }}
          SELF_CHECK_DRIFT_FAIL_RATIO: ${{ vars.SELF_CHECK_DRIFT_FAIL_RATIO }}
          # CLI 메일 발송 (기본 0 — Vercel Cron 이 발송. 필요 시 Variables 에 1 등록)
          SELF_CHECK_EMAIL_ON_CLI: ${{ vars.SELF_CHECK_EMAIL_ON_CLI || '0' }}
          SELF_CHECK_EMAIL_TO: ${{ vars.SELF_CHECK_EMAIL_TO }}
          SELF_CHECK_EMAIL_MODE: ${{ vars.SELF_CHECK_EMAIL_MODE }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # 미해결 이상 → GitHub 이슈 (자동 생성)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          echo "=== 주간 자가 점검 시작 ($(date -u) UTC / $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST) ==="
          node scripts/weekly-self-check-run.mjs 2>&1 | tee /tmp/weekly-self-check.log
          status=${PIPESTATUS[0]}
          echo "exit=$status" >> "$GITHUB_OUTPUT"
          if [ $status -ne 0 ]; then
            echo "::warning::주간 자가 점검에서 미해결 FAIL 항목이 발견되었습니다 — 보고서를 확인하세요."
          fi
          # FAIL 이어도 보고서 커밋은 진행합니다.
          exit 0

      - name: 보고서 커밋
        run: |
          set -euo pipefail
          echo "=== 생성된 보고서 ==="
          ls -lh reports/self-check/ 2>/dev/null || echo "reports/self-check 없음"
          ls -lh docs/inspections/ 2>/dev/null | tail -5 || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A reports/ docs/inspections/ 점검보고서_*.md 주간점검보고서_*.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "변경된 보고서 없음 — 커밋 생략"
            exit 0
          fi

          KST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          SUMMARY=$(node -e "
            try {
              const j = JSON.parse(require('fs').readFileSync('reports/self-check/latest.json','utf8'));
              const s = j.summary || {};
              console.log(\`\${s.overall} PASS \${s.pass}/\${s.total} WARN \${s.warn} FAIL \${s.fail} 자동복구 \${s.repaired}\`);
            } catch (e) { console.log(''); }
          ")
          git commit -m "docs: 주간 자가 점검 보고서 ${KST_DATE} — ${SUMMARY}" || echo "커밋 실패 (변경 없음)"
          git push || echo "::warning::푸시 실패 — 브랜치 보호 규칙을 확인하세요."

      - name: 점검 요약 출력
        if: always()
        run: |
          echo "### 🛠️ 주간 자가 점검 결과" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **일시**: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거**: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "reports/self-check/latest.md" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### 보고서 미리보기 (상위 70행)" >> "$GITHUB_STEP_SUMMARY"
            echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
            head -70 reports/self-check/latest.md >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "전체 보고서: \`reports/self-check/latest.md\` · 기준선: \`reports/self-check/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"

      - name: 보고서 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-self-check-report-${{ github.run_number }}
          path: |
            reports/self-check/
            docs/inspections/
            주간점검보고서_*.md
          if-no-files-found: warn
          retention-days: 90
