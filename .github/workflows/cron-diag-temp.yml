name: 크론 엔드포인트 진단 (임시)

# 임시 진단 워크플로 — /api/cron/* 엔드포인트가 Vercel 에서 실제로 응답하는지
# 저장소의 CRON_SECRET(실제 값)로 호출해 HTTP 상태·본문·주요 헤더를 확인합니다.
# 결과는 체크 런 주석(annotation)으로 남깁니다 — 이 샌드박스는 Actions 로그 zip
# 다운로드(results-receiver.actions.githubusercontent.com)가 차단되어 직접 읽을 수 없습니다.
# 확인 후 삭제 예정.

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cron-diag
  cancel-in-progress: false

jobs:
  probe:
    name: 크론 엔드포인트 응답 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 상태 코드 · 헤더 · 본문 확인
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://busan-hak-port-info.vercel.app
        run: |
          set +e

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::저장소 secret CRON_SECRET 이 없습니다."
            exit 1
          fi

          : > /tmp/report.txt
          for p in /api/cron/schedule-watch /api/cron-schedule-watch /api/cron/daily-cleanup /api/cron-daily-cleanup; do
            code=$(curl -sS -D /tmp/h.txt -o /tmp/b.txt -w '%{http_code}' \
              --max-time 120 \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${APP_URL}${p}" 2>/tmp/err.txt)
            rc=$?
            body=$(head -c 400 /tmp/b.txt 2>/dev/null | tr '\n' ' ')
            cache=$(grep -i -E '^(x-vercel-cache|cache-control|age|x-vercel-id):' /tmp/h.txt 2>/dev/null | tr '\n' ' | ')
            err=$(head -c 200 /tmp/err.txt 2>/dev/null | tr '\n' ' ')
            line="path=${p} rc=${rc} http=${code} cache[${cache}] err[${err}] body[${body}]"
            echo "$line" | tee -a /tmp/report.txt
            echo "::warning title=probe::${line}"
          done

          {
            echo "### 크론 엔드포인트 진단 결과"
            echo ""
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } > /tmp/comment.md

          jq -n --rawfile b /tmp/comment.md '{body: $b}' > /tmp/payload.json 2>/dev/null
          post_code=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/39/comments" 2>/dev/null)
          echo "::warning title=post::comment post http=${post_code} $(head -c 300 /tmp/post.json | tr '\n' ' ')"
          exit 0
