name: 크론 엔드포인트 진단 (임시)

# 임시 진단 워크플로 — /api/cron/* 엔드포인트가 Vercel 에서 실제로 응답하는지
# 저장소의 CRON_SECRET(실제 값)로 호출해 HTTP 상태·응답 헤더를 확인하고
# 결과를 PR 코멘트로 남깁니다(이 샌드박스에서는 Actions 로그 zip 다운로드가 차단됨).
# 확인 후 삭제 예정.

on:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cron-diag
  cancel-in-progress: false

jobs:
  probe:
    name: 크론 엔드포인트 응답 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 상태 코드 · 헤더 · 본문 확인
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://busan-hak-port-info.vercel.app
        run: |
          set -uo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::저장소 secret CRON_SECRET 이 없습니다."
            exit 1
          fi

          : > /tmp/report.txt
          for p in /api/cron/schedule-watch /api/cron-schedule-watch /api/cron/daily-cleanup /api/cron-daily-cleanup; do
            {
              echo "===== ${p} ====="
              curl -sS -D /tmp/h.txt -o /tmp/b.txt -w 'HTTP %{http_code}\n' \
                --max-time 120 \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${APP_URL}${p}" || echo "curl failed"
              echo "--- headers ---"
              cat /tmp/h.txt || true
              echo "--- body (앞 600자) ---"
              head -c 600 /tmp/b.txt || true
              echo
              echo
            } | tee -a /tmp/report.txt
          done

          {
            echo "### 크론 엔드포인트 진단 결과"
            echo ""
            echo '```'
            cat /tmp/report.txt
            echo '```'
          } > /tmp/comment.md

          jq -n --rawfile b /tmp/comment.md '{body: $b}' > /tmp/payload.json
          echo "--- posting comment ---"
          curl -sS -w '\nHTTP %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data @/tmp/payload.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/39/comments" | tail -c 600
