name: 코드 품질 검사

on:
  pull_request:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 빌드 및 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 소스 코드 받기
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 품질 검사
        run: npm run check

      - name: Java 설정 (Firestore 에뮬레이터용)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore 보안 규칙 테스트 (에뮬레이터)
        run: |
          set +e
          npm run test:rules 2>&1 | tee /tmp/rules.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "not ok|AssertionError|Error:|error:" /tmp/rules.log | head -10 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          fi
          exit $status

      - name: Firebase CLI 확인
        run: npx --yes firebase-tools@15.3.1 --version
